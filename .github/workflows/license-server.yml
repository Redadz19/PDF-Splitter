name: WARAKA License Server Tests

on:
  push:
    paths:
      - "license-server/**"
      - ".github/workflows/license-server.yml"
  pull_request:
    paths:
      - "license-server/**"
      - ".github/workflows/license-server.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: license-server
    env:
      PYTHONPATH: ${{ github.workspace }}/license-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: license-server/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest -q
      - name: Validate Alembic migration SQL
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost/waraka
        run: alembic upgrade --sql head
