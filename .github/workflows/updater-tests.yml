name: PDF Splitter Updater Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updater-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install license verification test dependencies
        run: python -m pip install cryptography==44.0.1 certifi>=2025.1.31
      - name: Run updater packaging tests
        run: python -m unittest discover -s tests -v
