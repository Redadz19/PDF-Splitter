name: Build PDF Splitter for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Generate WARAKA application icon
        run: python generate_icon.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build PDF Splitter
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name "PDF Splitter" --icon "assets/pdf_splitter.ico" --add-data "assets;assets" --collect-all PySide6 main.py

      - name: Build updater helper
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "PDF Splitter Updater" updater.py
          copy "dist\PDF Splitter Updater.exe" "dist\PDF Splitter\PDF Splitter Updater.exe"

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $env:APP_VERSION = (Get-Content version.txt -Raw).Trim()
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Splitter-Windows-1.3.1
          path: |
            dist/PDF Splitter/
            installer/PDF-Splitter-Setup.exe
          if-no-files-found: error
          retention-days: 30
