name: Build WARAKA for Windows

on:
  push:
    branches: [main, feature/waraka-reader-first, feature/waraka-auto-updates, feature/waraka-reader-layout]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Validate Python syntax
        run: python -m py_compile main.py reader_widget.py updater.py make_update.py

      - name: Generate WARAKA application icon
        run: python generate_icon.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build WARAKA application
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name "PDF Splitter" --icon "assets/pdf_splitter.ico" --add-data "assets;assets" --add-data "version.txt;." --collect-all PySide6 --collect-all fitz --collect-all certifi main.py

      - name: Build updater helper
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "PDF Splitter Updater" updater.py
          copy "dist\PDF Splitter Updater.exe" "dist\PDF Splitter\PDF Splitter Updater.exe"

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $env:APP_VERSION = "${{ steps.version.outputs.value }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Build full and in-app update packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          python make_update.py "dist\PDF Splitter" - "release-assets"

      - name: Upload WARAKA installer (for normal installation)
        uses: actions/upload-artifact@v4
        with:
          name: WARAKA-Setup-${{ steps.version.outputs.value }}
          path: installer/PDF-Splitter-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload full portable package
        uses: actions/upload-artifact@v4
        with:
          name: WARAKA-Full-${{ steps.version.outputs.value }}
          path: release-assets/PDF-Splitter-Full.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload in-app update package
        uses: actions/upload-artifact@v4
        with:
          name: WARAKA-Update-${{ steps.version.outputs.value }}
          path: release-assets/PDF-Splitter-Update.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: WARAKA ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            installer/PDF-Splitter-Setup.exe
            release-assets/PDF-Splitter-Full.zip
            release-assets/PDF-Splitter-Update.zip
