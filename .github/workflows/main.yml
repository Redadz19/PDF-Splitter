
name: Build PDF Splitter for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build standalone Windows application
        run: pyinstaller --noconfirm --clean --windowed --name "PDF Splitter" --collect-all fitz --collect-all PySide6 main.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer only
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Splitter-Installer
          path: installer/PDF-Splitter-Setup.exe
          if-no-files-found: error
          retention-days: 30
